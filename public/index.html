<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon agenda</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#2f5bea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#16212f;--mute:#667587;--line:#d9e1ea;--acc:#2f5bea;--accink:#fff;--today:#f2a900;--err:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1620;--card:#18222f;--ink:#e8eef6;--mute:#93a3b5;--line:#2a3849;--acc:#6f93ff;--accink:#0f1620;--today:#f2b83a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.hidden{display:none!important}
button,input,textarea{font:inherit;color:inherit}
select{font:inherit;color:inherit;color-scheme:light dark;padding:.65rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
input,textarea{width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.55rem .9rem}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
#auth{min-height:100vh;display:grid;place-items:center;padding:1rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2rem;width:100%;max-width:380px}
h1{font-size:2.4rem;line-height:1;margin:0 0 .3rem;font-weight:800;letter-spacing:-.03em}
.box p{color:var(--mute);margin:0 0 1.2rem}
label{display:block;margin:.8rem 0 .25rem;font-size:.9rem;color:var(--mute)}
.box .p{width:100%;margin-top:1.2rem}
.link{background:none;border:0;color:var(--acc);padding:.5rem 0;margin-top:.5rem;width:100%}
.rem{display:flex;align-items:center;gap:.5rem;margin:1rem 0 0;font-size:.95rem;color:var(--ink);cursor:pointer}
.rem input{width:auto;margin:0}
.err{color:var(--err);min-height:1.4em;margin:.6rem 0 0;font-size:.9rem}
#app{max-width:1000px;margin:0 auto;padding:1rem;display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:800px){#app{grid-template-columns:1.5fr 1fr;padding:2rem 1rem}header,#upcoming{grid-column:1/-1}}
@media(min-width:1180px){#app{max-width:1500px;grid-template-columns:1.4fr 1fr 1fr}#upcoming{grid-column:auto;position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow-y:auto}}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem}
header h1{font-size:1.6rem;margin:0}
header>div{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:.5rem}
header span{color:var(--mute);font-size:.9rem;overflow-wrap:anywhere}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.nav strong{text-transform:capitalize;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{color:var(--mute);font-size:.8rem}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;padding:0}
.day:hover{border-color:var(--line)}
.day.today{box-shadow:inset 0 0 0 2px var(--today)}
.day.sel{background:var(--acc);color:var(--accink)}
.day i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.day.sel i{background:var(--accink)}
.day i.none{visibility:hidden}
.panel h2{margin:0 0 .8rem;font-size:1.2rem;text-transform:capitalize}
.ev{border-left:4px solid var(--acc);padding:.3rem .7rem;margin-bottom:.6rem;display:flex;justify-content:space-between;gap:.5rem}
.ev small{color:var(--mute);display:block;white-space:pre-wrap}
.ev button{border:0;background:none;color:var(--mute);padding:.2rem .5rem}
.empty{color:var(--mute)}
.tabs{display:flex;gap:.4rem;margin-bottom:.9rem}
.tabs button{flex:1}
.up-day{margin:1rem 0 .4rem;font-size:.85rem;font-weight:600;color:var(--mute);text-transform:capitalize}
.up-day:first-child{margin-top:0}
.up-day.today{color:var(--today)}
.up-ev{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--acc);border-radius:0 8px 8px 0;background:var(--bg);padding:.4rem .7rem;margin-bottom:.4rem}
.up-ev.past{border-left-color:var(--mute);opacity:.8}
.up-ev:hover{background:var(--line)}
.up-ev small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
form.add{border-top:1px solid var(--line);margin-top:1rem;padding-top:.5rem}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:.6rem}
@media(max-width:520px){.row{grid-template-columns:minmax(0,1fr)}}
.hm{display:flex;align-items:center;gap:.3rem}
.hm select{flex:1;min-width:0}
</style>
</head>
<body>
<main id="auth">
  <form class="box" id="authForm">
    <h1>Mon agenda</h1>
    <p id="authSub">Connecte-toi pour retrouver tes événements.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <label class="rem"><input type="checkbox" id="remember"> Rester connecté</label>
    <div class="err" id="authErr" role="alert"></div>
    <button class="p" id="authBtn">Se connecter</button>
    <button type="button" class="link" id="toggle">Pas de compte ? Créer un compte</button>
  </form>
</main>

<div id="app" class="hidden">
  <header><h1>Mon agenda</h1><div><span id="who"></span><button id="notif" aria-pressed="false">🔕 Notifications désactivées</button><button id="logout">Se déconnecter</button></div></header>
  <section class="panel">
    <div class="nav"><button id="prev" aria-label="Mois précédent">‹</button><strong id="month"></strong><button id="next" aria-label="Mois suivant">›</button></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="panel">
    <h2 id="selTitle"></h2>
    <div id="list"></div>
    <form class="add" id="addForm">
      <label for="title">Nouvel événement</label>
      <input id="title" placeholder="Ex. Rendez-vous dentiste" required maxlength="200">
      <div class="row"><div><label for="hh">Heure</label><div class="hm"><select id="hh" aria-label="Heures"></select><span aria-hidden="true">:</span><select id="mm" aria-label="Minutes"></select></div></div><div><label for="note">Note</label><input id="note" maxlength="1000"></div></div>
      <button class="p" style="width:100%;margin-top:1rem">Ajouter l'événement</button>
    </form>
    <div class="err" id="appErr" role="alert"></div>
  </section>
  <aside class="panel" id="upcoming" aria-label="Événements à venir et passés">
    <div class="tabs" role="tablist">
      <button id="tabUp" class="p" role="tab" aria-selected="true" aria-controls="upList">À venir</button>
      <button id="tabPast" role="tab" aria-selected="false" aria-controls="upList">Passés</button>
    </div>
    <div id="upList" role="tabpanel"></div>
  </aside>
</div>

<script>
const $ = (s) => document.querySelector(s);
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const mk = (n) => ({ get: (k) => { try { return window[n].getItem(k); } catch { return null; } },
                    set: (k, v) => { try { v == null ? window[n].removeItem(k) : window[n].setItem(k, v); } catch {} } });
const local = mk("localStorage"), session = mk("sessionStorage");
let token = local.get("token") || session.get("token"), mail = local.get("mail") || session.get("mail"), events = [], view = new Date(), sel = iso(new Date()), registering = false, upTab = "up";
view.setDate(1);
// Menus d'heure : "--" = sans heure ; minutes par pas de 5
$("#hh").innerHTML = '<option value="">--</option>' + Array.from({ length: 24 }, (_, h) => { const v = String(h).padStart(2, "0"); return `<option value="${v}">${v}</option>`; }).join("");
$("#mm").innerHTML = Array.from({ length: 12 }, (_, i) => { const v = String(i * 5).padStart(2, "0"); return `<option value="${v}">${v}</option>`; }).join("");

async function api(path, method = "GET", body) {
  const r = await fetch("/api/" + path, { method, headers: { "content-type": "application/json", ...(token && { authorization: "Bearer " + token }) }, body: body && JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) logout();
  if (!r.ok) throw new Error(d.error || "Erreur réseau, réessaie.");
  return d;
}
function logout() { token = mail = null; for (const st of [local, session]) { st.set("token", null); st.set("mail", null); } local.set("notif", null); local.set("pushmode", null); events = []; show(); }
function show() { $("#auth").classList.toggle("hidden", !!token); $("#app").classList.toggle("hidden", !token); if (token) { $("#who").textContent = mail; updateNotifBtn(); render(); } }

$("#toggle").onclick = () => {
  registering = !registering;
  $("#authBtn").textContent = registering ? "Créer mon compte" : "Se connecter";
  $("#toggle").textContent = registering ? "Déjà un compte ? Se connecter" : "Pas de compte ? Créer un compte";
  $("#authSub").textContent = registering ? "Choisis un mot de passe d'au moins 8 caractères." : "Connecte-toi pour retrouver tes événements.";
  $("#pw").autocomplete = registering ? "new-password" : "current-password";
  $("#authErr").textContent = "";
};
$("#authForm").onsubmit = async (e) => {
  e.preventDefault(); $("#authErr").textContent = "";
  try {
    const d = await api(registering ? "register" : "login", "POST", { email: $("#email").value, password: $("#pw").value, remember: $("#remember").checked });
    token = d.token; mail = d.email;
    for (const st of [local, session]) { st.set("token", null); st.set("mail", null); }
    const st = $("#remember").checked ? local : session; st.set("token", token); st.set("mail", mail); $("#pw").value = "";
    events = await api("events"); show();
  } catch (err) { $("#authErr").textContent = err.message; }
};
$("#logout").onclick = async () => { await pushOff(); logout(); };
$("#prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("#next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

async function save(next) {
  const old = events; events = next; render(); $("#appErr").textContent = "";
  try { events = await api("events", "PUT", next); } catch (err) { events = old; $("#appErr").textContent = err.message; }
  render();
}
$("#addForm").onsubmit = (e) => {
  e.preventDefault();
  const ev = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), date: sel, time: $("#hh").value ? $("#hh").value + ":" + $("#mm").value : "", title: $("#title").value.trim(), note: $("#note").value.trim() };
  e.target.reset(); save([...events, ev]);
};

function render() {
  $("#month").textContent = view.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const g = $("#grid"); g.innerHTML = "";
  ["L", "M", "M", "J", "V", "S", "D"].forEach((d) => g.insertAdjacentHTML("beforeend", `<div class="dow">${d}</div>`));
  const off = (view.getDay() + 6) % 7, n = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate(), today = iso(new Date());
  for (let i = 0; i < off; i++) g.appendChild(document.createElement("div"));
  for (let d = 1; d <= n; d++) {
    const key = iso(new Date(view.getFullYear(), view.getMonth(), d));
    const b = document.createElement("button");
    b.className = "day" + (key === today ? " today" : "") + (key === sel ? " sel" : "");
    b.innerHTML = `${d}<i class="${events.some((e) => e.date === key) ? "" : "none"}"></i>`;
    b.onclick = () => { sel = key; render(); };
    g.appendChild(b);
  }
  $("#selTitle").textContent = new Date(sel + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const list = $("#list"); list.innerHTML = "";
  const day = events.filter((e) => e.date === sel).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
  if (!day.length) list.innerHTML = '<p class="empty">Rien de prévu ce jour-là.</p>';
  day.forEach((e) => {
    const el = document.createElement("div"); el.className = "ev";
    const t = document.createElement("div"), s = document.createElement("strong"), m = document.createElement("small");
    s.textContent = (e.time ? e.time + " · " : "") + e.title; m.textContent = e.note; t.append(s, m);
    const x = document.createElement("button"); x.textContent = "Supprimer"; x.setAttribute("aria-label", "Supprimer " + e.title);
    x.onclick = () => save(events.filter((v) => v.id !== e.id));
    el.append(t, x); list.appendChild(el);
  });
  renderUpcoming();
  checkNotifs();
}

// Panneau de droite : onglets « À venir » / « Passés »
function renderUpcoming() {
  const box = $("#upList"); box.innerHTML = "";
  const isUp = upTab === "up";
  $("#tabUp").classList.toggle("p", isUp); $("#tabUp").setAttribute("aria-selected", String(isUp));
  $("#tabPast").classList.toggle("p", !isUp); $("#tabPast").setAttribute("aria-selected", String(!isUp));
  const now = new Date(), today = iso(now), tomorrow = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1)), yesterday = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
  const hm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const isNext = (e) => e.date > today || (e.date === today && (!e.time || e.time >= hm));
  const cmp = (a, b) => a.date.localeCompare(b.date) || (a.time || "99").localeCompare(b.time || "99");
  const next = events.filter((e) => isUp ? isNext(e) : !isNext(e)).sort((a, b) => isUp ? cmp(a, b) : cmp(b, a));
  if (!next.length) { box.innerHTML = '<p class="empty">' + (isUp ? "Aucun événement à venir." : "Aucun événement passé.") + "</p>"; return; }
  const label = (d) => d === today ? "Aujourd'hui" : d === tomorrow ? "Demain" : d === yesterday ? "Hier"
    : new Date(d + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: d.slice(0, 4) !== String(now.getFullYear()) ? "numeric" : undefined });
  let last = "";
  next.forEach((e) => {
    if (e.date !== last) {
      last = e.date;
      const h = document.createElement("div"); h.className = "up-day" + (e.date === today ? " today" : ""); h.textContent = label(e.date); box.appendChild(h);
    }
    const b = document.createElement("button"), s = document.createElement("strong");
    b.className = "up-ev" + (isUp ? "" : " past"); s.textContent = (e.time ? e.time + " · " : "") + e.title; b.appendChild(s);
    if (e.note) { const m = document.createElement("small"); m.textContent = e.note; b.appendChild(m); }
    b.onclick = () => { sel = e.date; view = new Date(+e.date.slice(0, 4), +e.date.slice(5, 7) - 1, 1); render(); $("#selTitle").scrollIntoView({ behavior: "smooth", block: "nearest" }); };
    box.appendChild(b);
  });
}
$("#tabUp").onclick = () => { upTab = "up"; renderUpcoming(); };
$("#tabPast").onclick = () => { upTab = "past"; renderUpcoming(); };
setInterval(() => { if (token) renderUpcoming(); }, 60000);

// --- Notifications (fonctionnent tant que l'agenda est ouvert dans un onglet / l'appli) ---
const LEAD_MIN = 10, ALL_DAY_HOUR = 8; // rappel 10 min avant ; événements sans heure : 8h le jour même
const canNotif = () => "Notification" in window;
const notifOn = () => canNotif() && Notification.permission === "granted" && local.get("notif") === "1";
function updateNotifBtn() {
  const b = $("#notif"), on = notifOn();
  b.textContent = on ? "🔔 Notifications activées" : "🔕 Notifications désactivées";
  b.classList.toggle("p", on); b.setAttribute("aria-pressed", String(on));
}
async function notify(title, body, tag) {
  try {
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) await reg.showNotification(title, { body, tag }); else new Notification(title, { body, tag });
  } catch {}
}
const b64ToBytes = (b) => Uint8Array.from(atob((b + "=".repeat((4 - b.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
async function pushSubscribe() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("non supporté sur cet appareil");
  const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error("service worker indisponible")), 5000))]);
  const { key } = await api("push/key");
  const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) }));
  await api("push/subscribe", "POST", { subscription: sub.toJSON(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
}
async function pushOff() {
  try {
    if (local.get("pushmode") === "1" && "serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.getRegistration(), sub = reg && await reg.pushManager.getSubscription();
      if (sub) { if (token) await api("push/unsubscribe", "POST", { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    }
  } catch {}
  local.set("pushmode", null);
}
$("#notif").onclick = async () => {
  const err = $("#appErr"); err.textContent = "";
  if (notifOn()) { await pushOff(); local.set("notif", null); updateNotifBtn(); return; }
  if (!canNotif()) { err.textContent = "Ce navigateur ne gère pas les notifications. Sur iPhone, ajoute d'abord le site à l'écran d'accueil (Partager > Sur l'écran d'accueil) et ouvre-le depuis l'icône."; return; }
  let perm = Notification.permission;
  if (perm === "default") perm = await Notification.requestPermission();
  if (perm !== "granted") { err.textContent = "Notifications bloquées : autorise-les dans les réglages du site de ton navigateur, puis réessaie."; updateNotifBtn(); return; }
  local.set("notif", "1");
  try {
    await pushSubscribe(); local.set("pushmode", "1");
    notify("Notifications activées", "Tu seras prévenu " + LEAD_MIN + " min avant tes événements, même appli fermée.", "welcome");
  } catch (e) {
    local.set("pushmode", null);
    err.textContent = "Rappels appli fermée indisponibles (" + e.message + "). Les notifications ne marcheront que si l'agenda est ouvert.";
    notify("Notifications activées", "Seulement tant que l'agenda est ouvert.", "welcome");
  }
  updateNotifBtn(); checkNotifs();
};
function checkNotifs() {
  if (!token || !notifOn() || local.get("pushmode") === "1") return; // en mode push, c'est le serveur qui envoie
  const now = Date.now();
  let done; try { done = new Set(JSON.parse(local.get("notified") || "[]")); } catch { done = new Set(); }
  const keys = new Set(); let changed = false;
  events.forEach((e) => {
    const [y, m, d] = e.date.split("-").map(Number), key = e.id + "|" + e.date + "|" + e.time;
    keys.add(key);
    let start, due;
    if (e.time) { const [h, mi] = e.time.split(":").map(Number); start = new Date(y, m - 1, d, h, mi).getTime(); due = start - LEAD_MIN * 60000; }
    else { due = new Date(y, m - 1, d, ALL_DAY_HOUR).getTime(); start = new Date(y, m - 1, d + 1).getTime(); }
    if (now >= due && now < start && !done.has(key)) {
      done.add(key); changed = true;
      notify(e.title, (e.time ? "À " + e.time : "Aujourd'hui") + (e.note ? " · " + e.note : ""), key);
    }
  });
  const kept = events.length ? [...done].filter((k) => keys.has(k)) : [...done];
  if (changed || kept.length !== done.size) local.set("notified", JSON.stringify(kept));
}
setInterval(checkNotifs, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNotifs(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

(async () => { show(); if (token) { try { events = await api("events"); render(); } catch {} } })();
</script>
</body>
</html>
